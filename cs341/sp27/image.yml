# Offering manifest. The semester comes from this directory's name, not from a
# CI input, so duplicating a semester is a directory copy. See docs/DESIGN.md.
class: cs341
semester: sp27
status: active          # active | frozen — frozen offerings are never rebuilt automatically
owners: ["angrave"]
images:
  - subname: img1
    dockerfile: Dockerfile
    smoke: ci-smoke.sh
multiarch: false        # amd64 only; students' MPs assume x86-64
notes: >
  Smaller Debian trixie-slim base, chosen instead of the Fall 2026 Ubuntu
  image. Package versions are not yet pinned: the first successful build
  records the resolved versions, which then become apt_pins here.
