# CS 411 (Database Systems) — untested draft (support file for Dockerfile.suggested), generated from public course materials; never run. Discussion starter only — see CommentsForClass.md in this directory; the working example is cs341/fa26/Dockerfile.

# Low-memory mongod for one student.
storage:
  dbPath: /data/mongodb
  wiredTiger:
    engineConfig:
      # Default is max(50% of (RAM-1GB), 256MB) of the *host/cgroup*; pin it.
      cacheSizeGB: 0.25
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
net:
  port: 27017
  bindIp: 127.0.0.1
  maxIncomingConnections: 50
operationProfiling:
  mode: "off"
setParameter:
  # Free-monitoring/diagnostic collection off to cut background CPU/RAM.
  diagnosticDataCollectionEnabled: false
