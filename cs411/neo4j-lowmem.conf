# CS 411 (Database Systems) — untested draft (support file for Dockerfile.suggested), generated from public course materials; never run. Discussion starter only — see CommentsForClass.md in this directory; the working example is cs341/fa26/Dockerfile.


# ---- Appended by CS411 container build: low-memory overrides ----
# JVM heap: Neo4j otherwise sizes heap/pagecache from total (host) memory.
server.memory.heap.initial_size=128m
server.memory.heap.max_size=384m
server.memory.pagecache.size=128m
dbms.memory.transaction.total.max=128m
server.jvm.additional=-XX:+UseSerialGC
server.jvm.additional=-XX:MaxMetaspaceSize=128m
server.jvm.additional=-Xss512k

# Data on the persistent volume.
server.directories.data=/data/neo4j

# Community edition allows one user database; name it like the course's
# Neo4j Desktop DBMS so student code using database="academicworld" works.
initial.dbms.default_database=academicworld

# Listen on all container interfaces so the proxy can reach Browser (7474)
# and Bolt (7687). Keep auth ON; password set by entrypoint.sh.
server.default_listen_address=0.0.0.0
dbms.security.auth_enabled=true

# No automatic update checks / usage reporting (SP26 students reported
# Neo4j auto-updates breaking accounts on the CS411 VM).
dbms.usage_report.enabled=false
