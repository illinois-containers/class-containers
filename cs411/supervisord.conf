; CS 411 (Database Systems) — untested draft (support file for Dockerfile.suggested), generated from public course materials; never run. Discussion starter only — see CommentsForClass.md in this directory; the working example is cs341/fa26/Dockerfile.

; Process supervisor replacing systemd units for mysql, mongod, neo4j, sshd.
; Students control services with `sudo supervisorctl restart neo4j`
; (or `sudo systemctl restart neo4j` via the shim).

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:mysql]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=true
priority=10
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/mysql.log
redirect_stderr=true

[program:mongod]
command=/usr/bin/mongod --config /etc/mongod.conf
user=mongodb
autostart=true
autorestart=true
priority=10
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/mongod.log
redirect_stderr=true

[program:neo4j]
command=/usr/bin/neo4j console
user=neo4j
environment=HOME="/var/lib/neo4j",NEO4J_CONF="/etc/neo4j"
autostart=true
autorestart=true
priority=20
startsecs=15
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/neo4j.log
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/sshd.log
redirect_stderr=true

; Option to save RAM: set autostart=false for neo4j/mongod and let students
; start them only for MP3/MP5/project work.
